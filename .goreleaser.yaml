# GoReleaser configuration
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: ysf-nexus

before:
  hooks:
    - go mod tidy
    - task frontend

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/ysf-nexus
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.BuildTime={{.Date}}

archives:
  - formats: [tar.gz]
    # this name template makes the arm64 binaries look more standard
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: dbehnke
    name: ysf-nexus
  prerelease: auto
